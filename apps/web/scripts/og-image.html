<!doctype html>
<!--
  Social preview image (1200x630) for app/opengraph-image.png and app/twitter-image.png.
  Render from apps/web:
    google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --screenshot=app/opengraph-image.png "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Mona Sans";
    src: url("../app/fonts/mona-sans.woff2") format("woff2");
    font-weight: 200 900;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0d1117;
    color: #f0f6fc;
    font-family: "Mona Sans", sans-serif;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 45% 55% at 18% 18%, rgba(171,125,248,0.30), transparent 70%),
      radial-gradient(ellipse 40% 50% at 8% 85%, rgba(68,147,248,0.22), transparent 70%),
      radial-gradient(ellipse 45% 60% at 92% 90%, rgba(63,185,80,0.14), transparent 70%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(240,246,252,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,246,252,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, #000 0%, transparent 70%);
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
  h1 {
    margin-top: 36px;
    font-size: 58px; font-weight: 800; line-height: 1.04; letter-spacing: -0.035em;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #4493f8, #ab7df8 55%, #db61a2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.lead { margin-top: 22px; font-size: 23px; line-height: 1.4; color: #9198a1; }
  .meta { position: absolute; left: 72px; bottom: 44px; display: flex; gap: 10px; }
  .chip {
    padding: 7px 14px; border-radius: 999px;
    border: 1px solid #3d444d; background: rgba(21,27,35,0.85);
    font-size: 17px; font-weight: 600; color: #f0f6fc;
  }
  .chip.url { color: #4493f8; }
  .shot {
    position: absolute; left: 720px; top: 84px; width: 760px;
    border: 1px solid #3d444d; border-radius: 16px; overflow: hidden;
    background: #010409;
    box-shadow: 0 30px 90px -10px rgba(171,125,248,0.45), 0 20px 40px rgba(1,4,9,0.7);
  }
  .bar { display: flex; gap: 8px; padding: 12px 16px; background: #151b23; border-bottom: 1px solid #262c36; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3d444d; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="shot">
    <div class="bar"><i></i><i></i><i></i></div>
    <img src="../public/screenshots/repositories.png" alt="">
  </div>
  <div class="copy">
    <div class="brand"><img src="../public/logo.svg" alt=""><span>Vexo</span></div>
    <h1>Every GitHub account.<br><em>The right key.<br>Every time.</em></h1>
    <p class="lead">SSH keys, GitHub profiles and commit authors, managed on your desktop.</p>
  </div>
  <div class="meta">
    <span class="chip">Free &amp; open source</span>
    <span class="chip">macOS · Windows · Linux</span>
    <span class="chip url">vexo.joydas.dev</span>
  </div>
</body>
</html>
