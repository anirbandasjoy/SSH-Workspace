[package]
name = "vexo"
version = "0.1.1"
description = "Switch GitHub accounts and SSH keys with confidence"
edition = "2021"
license = "MIT"
authors = ["Joy Das"]
repository = "https://github.com/anirbandasjoy/vexo"
homepage = "https://vexo.joydas.dev"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
glob = "0.3"
libc = "0.2"
